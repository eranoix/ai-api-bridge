# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai-api-bridge
#   sudo ln -s /etc/nginx/sites-available/ai-api-bridge /etc/nginx/sites-enabled/
#   # Adjust server_name and certbot directives as appropriate.
#   sudo certbot --nginx -d api.example.com
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=gateway_edge:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=gateway_conn:10m;

upstream gateway_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    server_tokens off;

    # Multimodal payloads can be large.
    client_max_body_size 25M;
    client_body_buffer_size 1M;
    client_body_timeout 60s;

    # Edge rate limit is defense in depth; the app also enforces per-key limits.
    limit_req zone=gateway_edge burst=60 nodelay;
    limit_conn gateway_conn 20;

    # Health: cheap, unauthenticated, no rate limit.
    location = /healthz {
        proxy_pass http://gateway_backend;
        access_log off;
    }

    location / {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # CRITICAL: SSE must not be buffered, gzipped, or cached.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;

        # Streams may run for many minutes, so keep timeouts generous.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
