# Install:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/ai-api-bridge
#   sudo logrotate -d /etc/logrotate.d/ai-api-bridge     # dry-run

# Application stdout (when not routed through journald). Adjust path if the
# service writes its own files; default is journalctl.
/var/log/ai-api-bridge/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 gateway gateway
    sharedscripts
    postrotate
        systemctl kill -s HUP ai-api-bridge.service 2>/dev/null || true
    endscript
}
